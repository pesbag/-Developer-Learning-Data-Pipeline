services:
  broker:
    image: apache/kafka:latest
    container_name: broker
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-cluster.sh cluster-id --bootstrap-server localhost:9092 || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 20s

  mongo:
    image: mongo:latest
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  raw-producer:
    build:
      context: ./RawProducer
      dockerfile: Dockerfile
    container_name: raw_producer
    command: python RawProducer.py
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=broker:29092
    volumes:
      - ./AllDataFiles:/AllDataFiles
    depends_on:
      broker:
        condition: service_healthy

  raw-consumer:
    build:
      context: ./RawProducer
      dockerfile: Dockerfile
    container_name: raw_consumer
    command: python RawConsumer.py
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=broker:29092
    depends_on:
      broker:
        condition: service_healthy

  csharp-consumer:
    build:
      context: ./Consumer
      dockerfile: Dockerfile
    container_name: csharp_consumer
    environment:
      - Kafka__Consumer__BootstrapServers=broker:29092
      - MongoDb__ConnectionString=mongodb://mongo:27017
    depends_on:
      broker:
        condition: service_healthy
      mongo:
        condition: service_started

volumes:
  mongo_data: